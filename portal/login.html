<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script src="../i18n-boot.js"></script>
    <title>مكتب الجيار و زين | تسجيل الدخول</title>
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="الجيار و زين" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="../assets/sign_trans.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Cinzel:wght@600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Cinzel:wght@600;700&display=swap" /></noscript>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="portal.css?v=72" />
  </head>
  <body class="portal-page portal-login-page" data-page="portal-login">
    <header class="portal-header">
      <div class="container">
        <a class="portal-brand" href="../index.html">
          <img class="portal-brand-logo" src="../assets/gztholothfont.png" alt="مكتب الجيار و زين" />
        </a>
        <a class="portal-muted-link" href="../index.html">العودة للموقع</a>
      </div>
    </header>
    <main class="portal-main">
      <div class="container">
        <div class="portal-card">
          <h1 data-i18n="portal.login.title">تسجيل الدخول</h1>
          <p class="portal-lead" data-i18n="portal.login.lead">هذه الصفحه خاصه بأعضاء المكتب فقط</p>
          <div id="loginAlert" class="portal-alert portal-alert--error" hidden></div>
          <form id="loginForm" class="portal-form">
            <label>
              <span data-i18n="portal.field.username">اسم المستخدم</span>
              <input
                type="text"
                name="username"
                placeholder="الاسم"
                autocomplete="username"
                autocapitalize="off"
                spellcheck="false"
                required
              />
            </label>
            <label>
              <span data-i18n="portal.field.password">كلمة المرور</span>
              <input type="password" name="password" autocomplete="current-password" required />
            </label>
            <label class="portal-checkbox">
              <input type="checkbox" name="remember_me" value="1" />
              <span>تذكرني على هذا الجهاز</span>
            </label>
            <div class="portal-actions">
              <button class="btn" type="submit" data-i18n="portal.login.submit">دخول</button>
            </div>
          </form>
        </div>
      </div>
    </main>
    <script src="../i18n.js"></script>
    <script src="api-config.js?v=3"></script>
    <script src="portal.js?v=22"></script>
    <script>
      const form = document.getElementById("loginForm");
      const alertEl = document.getElementById("loginAlert");

      const loginParams = new URLSearchParams(window.location.search);
      loginParams.delete("token");
      loginParams.delete("session");
      loginParams.delete("password");
      loginParams.delete("username");
      const afterLogin = Portal.safePortalNext(loginParams.get("next")) || "home.html";

      Portal.redirectIfAuthed(afterLogin);
      Portal.initPasswordToggles(form);

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        Portal.hideAlert(alertEl);
        const fd = new FormData(form);
        const username = String(fd.get("username") || "").trim();
        const password = String(fd.get("password") || "");
        if (!username || !password) {
          Portal.showAlert(alertEl, "اسم المستخدم وكلمة المرور مطلوبان.");
          return;
        }
        try {
          await Portal.request("/auth/login", {
            method: "POST",
            body: JSON.stringify({
              username,
              password,
              remember_me: fd.get("remember_me") === "1",
            }),
          });
          window.location.replace(afterLogin);
        } catch (error) {
          Portal.showAlert(alertEl, error.message);
        }
      });
    </script>
  </body>
</html>
