    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="الجيار و زين" />

  <body class="portal-page" data-page="portal-section" data-portal-page="section">
    <header class="portal-header">
      <div class="container portal-header__bar">
        <a class="portal-brand" href="../index.html">
          <img class="portal-brand-logo" src="../assets/gztholothfont.png" alt="مكتب الجيار و زين" />
        </a>
        <div class="portal-header__end">
          <button type="button" class="portal-nav-toggle" id="portalNavToggle" hidden aria-controls="portalHeaderNav" aria-expanded="false" aria-label="فتح القائمة">
            <svg class="portal-nav-toggle__open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round" /></svg>
            <svg class="portal-nav-toggle__close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round" /></svg>
          </button>
          <nav class="portal-header-nav" id="portalHeaderNav" aria-label="تنقل لوحة التحكم">
            <div class="portal-header-nav__links" id="adminNavLinks">
              <a class="portal-nav-link" href="home.html" data-nav="home">الرئيسيه</a>
              <a class="portal-nav-link" href="clients.html" data-nav="clients" data-admin-only hidden>الموكلين</a>
              <a class="portal-nav-link" href="cases.html" data-nav="cases">القضايا</a>
              <a class="portal-nav-link" href="archived.html" data-nav="archived" data-admin-only hidden>المؤرشفه</a>
              <a class="portal-nav-link" href="tasks.html" data-nav="tasks">المهام</a>
              <a class="portal-nav-link" href="calendar.html" data-nav="calendar">الأجنده</a>
              <a class="portal-nav-link" href="attachments.html" data-nav="attachments" data-attachments-nav hidden>المرفقات</a>
              <a class="portal-nav-link" href="sections.html" data-nav="sections" data-sections-nav hidden>الأقسام</a>
              <a class="portal-nav-link" href="admin.html" data-nav="admin" data-admin-only hidden data-i18n="portal.admin.link">الحسابات</a>
              <a class="portal-nav-link" href="profile.html" data-nav="profile" id="profileNavLink" hidden>الملف الشخصي</a>
            </div>
          </nav>
          <button id="logoutBtn" class="portal-btn-sm portal-header-cta" type="button" data-i18n="portal.logout">تسجيل الخروج</button>
        </div>
      </div>
      <div class="portal-nav-backdrop" id="portalNavBackdrop" hidden></div>
    </header>
    <main class="portal-main">
      <div class="container portal-dashboard">
        <div class="portal-dashboard-head">
          <div>
            <a class="portal-back-link" href="sections.html" id="sectionBackToList" hidden>
              <svg class="portal-back-link__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
                <path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <span>الأقسام</span>
            </a>
            <h1 id="sectionTitle">القسم</h1>
            <p id="sectionLead">قضايا القسم</p>
          </div>
        </div>
        <div id="sectionAlert" class="portal-alert portal-alert--error" hidden></div>
        <section class="portal-panel" id="sectionTeamPanel" hidden></section>
        <div class="portal-section-workspace">
          <section class="portal-panel portal-section-workspace__cases">
            <div class="portal-panel-head">
              <div>
                <button type="button" class="portal-back-link" id="sectionBackToBoxes" hidden>
                  <svg class="portal-back-link__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
                    <path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                  <span>الأقسام الفرعية</span>
                </button>
                <h2 id="sectionCasesHeading">قضايا القسم</h2>
              </div>
            </div>
            <div id="sectionCasesMount" class="portal-section-cases-mount">
              <div class="portal-table-wrap">
                <table class="portal-section-table portal-section-table--cases" id="sectionCasesTable">
                  <thead>
                    <tr>
                      <th>القضية</th>
                      <th>الموكل</th>
                      <th>المسؤول</th>
                      <th>الحالة</th>
                    </tr>
                  </thead>
                  <tbody id="sectionCasesBody"></tbody>
                </table>
              </div>
            </div>
          </section>
          <section class="portal-panel portal-section-workspace__detail" id="sectionCasePanel">
            <p class="portal-detail-empty" id="sectionCasePlaceholder">اختر قضية لعرض بياناتها ومرفقاتها ومسار المهام.</p>
            <div id="sectionCaseDetail" hidden></div>
          </section>
        </div>
      </div>
    </main>

    <dialog id="attachmentPreviewDialog" class="portal-dialog portal-dialog--preview">
      <div class="portal-preview-dialog">
        <div class="portal-preview-head">
          <h2 id="attachmentPreviewTitle">معاينة المرفق</h2>
          <button type="button" class="portal-btn-ghost portal-btn-ghost--sm" id="closeAttachmentPreviewBtn">إغلاق</button>
        </div>
        <div id="attachmentPreviewBody" class="portal-preview-body"></div>
      </div>
    </dialog>

    <script src="../i18n.js"></script>
    <script src="api-config.js"></script>
    <script src="portal.js?v=22"></script>
    <script src="portal-nav.js?v=27"></script>
    <script src="section-app.js?v=26"></script>
  </body>
