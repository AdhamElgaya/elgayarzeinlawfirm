name = "elgayarzeinlawfirm"
main = "workers/frontend.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
run_worker_first = ["/api/*"]

[[routes]]
pattern = "www.gzlawfirm.net/*"
zone_name = "gzlawfirm.net"

[[routes]]
pattern = "gzlawfirm.net/*"
zone_name = "gzlawfirm.net"

[vars]
RAILWAY_API_URL = "https://elgayarzeinlawfirm-production-f6ce.up.railway.app"
